[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verkeep-verify"
version = "0.1.0"
description = "AI API Real-time Monitor - 给你的 AI API 装监控摄像头"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Verkeep Verify Team" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.0.0",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.19.0",
    "PyYAML>=6.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
ml = [
    "numpy>=1.21.0",
    "scikit-learn>=1.0.0",
    "sentence-transformers>=2.2.0",
    "joblib>=1.1.0",
    "llm-fingerprinter>=0.2.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
verkeep-verify = "verkeep_verify.cli:main"

[project.urls]
Homepage = "https://github.com/ai-verify-cli/ai-verify"
Documentation = "https://github.com/ai-verify-cli/ai-verify#readme"
Repository = "https://github.com/ai-verify-cli/ai-verify"
Issues = "https://github.com/ai-verify-cli/ai-verify/issues"

[tool.hatch.build.targets.wheel]
packages = ["verkeep_verify"]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
